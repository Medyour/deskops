name: CI

on:
    push:
        branches: [main, 'agent/**']
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

defaults:
    run:
        shell: bash

jobs:
    check:
        name: PHP 8.3 · ${{ matrix.label }} · Node 24
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                include:
                    - connection: sqlite
                      label: SQLite
                    - connection: pgsql
                      label: PostgreSQL 18
        env:
            CI: 'true'
            COMPOSER_NO_INTERACTION: '1'
            DB_CONNECTION: ${{ matrix.connection }}
            DATABASE_URL: ${{ matrix.connection == 'pgsql' && 'postgresql://deskops@127.0.0.1:5432/deskops_test?sslmode=disable' || '' }}

        services:
            postgres:
                image: ${{ matrix.connection == 'pgsql' && 'postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336' || '' }}
                env:
                    POSTGRES_USER: deskops
                    POSTGRES_DB: deskops_test
                    # Authentication without a password only inside this disposable CI runner.
                    POSTGRES_HOST_AUTH_METHOD: trust
                ports:
                    - 127.0.0.1:5432:5432
                options: >-
                    --health-cmd "pg_isready -h 127.0.0.1 -U deskops -d deskops_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 30

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Read Composer version
              run: echo "COMPOSER_VERSION=$(cat .composer-version)" >> "$GITHUB_ENV"

            - name: Set up PHP 8.3
              uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
              with:
                  php-version: '8.3'
                  extensions: pdo_pgsql, pdo_sqlite, sqlite3, mbstring, intl, curl, dom, xml, fileinfo, zip
                  coverage: none
                  tools: composer:${{ env.COMPOSER_VERSION }}
              env:
                  fail-fast: 'true'

            - name: Set up Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .node-version
                  cache: npm
                  cache-dependency-path: package-lock.json
                  package-manager-cache: false

            - name: Verify runtimes and database extensions
              run: |
                  php --version
                  composer --version
                  node --version
                  npm --version
                  php -r 'if (PHP_MAJOR_VERSION !== 8 || PHP_MINOR_VERSION !== 3) { fwrite(STDERR, "PHP 8.3 required\n"); exit(1); } foreach (["pdo_pgsql", "pdo_sqlite", "sqlite3"] as $extension) { if (!extension_loaded($extension)) { fwrite(STDERR, "Missing extension: ".$extension."\n"); exit(1); } }'
                  test "$(node --version)" = "v$(cat .node-version)"
                  test "$(npm --version)" = "$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).packageManager.split("@")[1]')"
                  test "$(composer --version --no-ansi | cut -d ' ' -f 3)" = "$(cat .composer-version)"

            - name: Locate Composer download cache
              id: composer-cache
              run: echo "path=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache Composer downloads
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ steps.composer-cache.outputs.path }}
                  key: ${{ runner.os }}-composer-php83-${{ env.COMPOSER_VERSION }}-${{ hashFiles('composer.lock') }}

            - name: Install from lockfiles on a fresh SQLite database
              if: matrix.connection == 'sqlite'
              run: |
                  test ! -e .env
                  test ! -e database/database.sqlite
                  composer run setup
                  test -s database/database.sqlite

            - name: Verify PostgreSQL readiness and major version
              if: matrix.connection == 'pgsql'
              run: |
                  version=$(docker exec "${{ job.services.postgres.id }}" psql -U deskops -d deskops_test -Atc "SHOW server_version_num")
                  test "$version" -ge 180000
                  test "$version" -lt 190000
                  echo "PostgreSQL server_version_num=$version"

            - name: Install from lockfiles on a fresh PostgreSQL database
              if: matrix.connection == 'pgsql'
              run: |
                  test ! -e .env
                  composer install --no-interaction --prefer-dist
                  cp .env.example .env
                  php artisan config:clear --no-interaction
                  php artisan key:generate --no-interaction
                  php artisan migrate --force --no-interaction
                  npm ci --ignore-scripts
                  npm run build

            - name: Check quality, security audits, tests and Vite build
              run: composer run check

            - name: Run the complete test suite in a reproducible random order
              run: |
                  APP_ENV=testing APP_DEMO_MODE=false BCRYPT_ROUNDS=4 CACHE_STORE=array MAIL_MAILER=array QUEUE_CONNECTION=sync SESSION_DRIVER=array DB_DATABASE=:memory: php artisan config:cache --no-interaction
                  php artisan route:cache --no-interaction
                  php vendor/bin/pest --compact --order-by=random --random-order-seed=20261011

    production:
        name: Production image · PostgreSQL 18
        runs-on: ubuntu-24.04
        timeout-minutes: 25
        services:
            postgres:
                image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
                env:
                    POSTGRES_USER: deskops
                    POSTGRES_DB: deskops_test
                    POSTGRES_HOST_AUTH_METHOD: trust
                options: >-
                    --health-cmd "pg_isready -h 127.0.0.1 -U deskops -d deskops_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 30
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Validate App Spec offline with the official CLI
              run: |
                  validator="$RUNNER_TEMP/doctl"
                  mkdir -p "$validator"
                  cd "$validator"
                  curl -fsSLO https://github.com/digitalocean/doctl/releases/download/v1.185.0/doctl-1.185.0-linux-amd64.tar.gz
                  curl -fsSLO https://github.com/digitalocean/doctl/releases/download/v1.185.0/doctl-1.185.0-checksums.sha256
                  tr -d '\r' < doctl-1.185.0-checksums.sha256 | rg --fixed-strings 'doctl-1.185.0-linux-amd64.tar.gz' | sha256sum --check -
                  tar -xzf doctl-1.185.0-linux-amd64.tar.gz
                  cd "$GITHUB_WORKSPACE"
                  env -u DIGITALOCEAN_ACCESS_TOKEN -u DOCTL_ACCESS_TOKEN "$validator/doctl" --config "$validator/no-auth.yaml" apps spec validate --schema-only .do/app.yaml > /dev/null
                  for script in .do/*.sh; do sh -n "$script"; done
                  bash -n tests/production-image.sh

            - name: Build the production artifact without runtime secrets
              run: docker build --file .do/Dockerfile --tag deskops-production-test .

            - name: Test migrations resets Apache and both demo sessions
              env:
                  POSTGRES_ID: ${{ job.services.postgres.id }}
              run: bash tests/production-image.sh
