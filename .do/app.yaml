      dockerfile_path: .do/Dockerfile
      source_dir: /
      instance_count: 1
      instance_size_slug: apps-s-1vcpu-0.5gb
      envs:
          - key: APP_NAME
            value: 'DeskOps'
            scope: RUN_TIME
            type: GENERAL
          - key: APP_ENV
            value: 'production'
            scope: RUN_TIME
            type: GENERAL
          - key: APP_DEBUG
            value: 'false'
            scope: RUN_TIME
            type: GENERAL
          - key: APP_DEMO_MODE
