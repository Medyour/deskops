      kind: SCHEDULED
      schedule:
          cron: '0 4 * * *'
          time_zone: Europe/Paris
      run_command: sh .do/reset-demo.sh
databases:
    - name: deskops-db
      engine: PG
      version: '18'
      production: false
ingress:
    rules:
        - match:
              authority:
                  exact: deskops-9f7a8.ondigitalocean.app
              path:
                  prefix: /
          redirect:
              authority: deskops.mkirchel.com
              scheme: https
              redirect_code: 301
        - component:
              name: web
          match:
              path:
                  prefix: /
