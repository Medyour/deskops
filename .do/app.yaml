# Add APP_KEY manually: web component only, encrypted SECRET, RUN_TIME.
# London (LON1) is the App Platform region slug "lon".
name: deskops
region: lon
domains:
    - domain: deskops.mkirchel.com
      type: PRIMARY
services:
    - name: web
      github:
          repo: Medyour/deskops
          branch: main
          deploy_on_push: false
      dockerfile_path: .do/Dockerfile
      source_dir: /
      instance_count: 1
      instance_size_slug: apps-s-1vcpu-0.5gb
      envs:
          - key: APP_NAME
            value: 'DeskOps'
            scope: RUN_TIME
            type: GENERAL
          - key: APP_ENV
            value: 'production'
            scope: RUN_TIME
            type: GENERAL
          - key: APP_DEBUG
            value: 'false'
            scope: RUN_TIME
            type: GENERAL
          - key: APP_DEMO_MODE
            value: 'true'
            scope: RUN_TIME
            type: GENERAL
          - key: APP_URL
            value: '${APP_URL}'
            scope: RUN_TIME
            type: GENERAL
          - key: DB_CONNECTION
            value: 'pgsql'
            scope: RUN_TIME
            type: GENERAL
          - key: DATABASE_URL
            value: '${deskops-db.DATABASE_PRIVATE_URL}'
            scope: RUN_TIME
            type: SECRET
          - key: CACHE_STORE
            value: 'database'
            scope: RUN_TIME
            type: GENERAL
          - key: SESSION_DRIVER
            value: 'database'
            scope: RUN_TIME
            type: GENERAL
          - key: SESSION_SECURE_COOKIE
            value: 'true'
            scope: RUN_TIME
            type: GENERAL
          - key: SESSION_HTTP_ONLY
            value: 'true'
            scope: RUN_TIME
            type: GENERAL
          - key: SESSION_SAME_SITE
            value: 'lax'
            scope: RUN_TIME
            type: GENERAL
          - key: QUEUE_CONNECTION
            value: 'sync'
            scope: RUN_TIME
            type: GENERAL
          - key: LOG_CHANNEL
            value: 'stderr'
            scope: RUN_TIME
            type: GENERAL
          - key: LOG_LEVEL
            value: 'warning'
            scope: RUN_TIME
            type: GENERAL
          - key: MAIL_MAILER
            value: 'array'
            scope: RUN_TIME
            type: GENERAL
          - key: APP_LOCALE
            value: 'fr'
            scope: RUN_TIME
            type: GENERAL
          - key: APP_FALLBACK_LOCALE
            value: 'fr'
            scope: RUN_TIME
            type: GENERAL
          - key: TRUSTED_PROXIES
            value: 'REMOTE_ADDR'
            scope: RUN_TIME
            type: GENERAL
      run_command: sh .do/start-web.sh
      http_port: 8080
      health_check:
          http_path: /health
          initial_delay_seconds: 10
          period_seconds: 10
          timeout_seconds: 3
          success_threshold: 1
          failure_threshold: 3
