ServerTokens Prod
ServerSignature Off
<IfModule mpm_prefork_module>
    StartServers 2
    MinSpareServers 1
    MaxSpareServers 2
    ServerLimit 4
    MaxRequestWorkers 4
    MaxConnectionsPerChild 1000
</IfModule>
<VirtualHost *:8080>
    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog /proc/self/fd/2
    # Do not log request URLs, query strings, cookies or authorization headers.
    LogFormat "%m %>s %D" deskops
    CustomLog /proc/self/fd/2 deskops
</VirtualHost>
